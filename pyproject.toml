[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-multiblock"
version = "0.1.0"
description = "General multi-block structured hexahedral (O-grid/butterfly) mesh engine with OpenFOAM export and RBF morphing."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
scipy = ["scipy>=1.9"]
stl = ["trimesh>=3.20"]
dev = ["pytest>=7"]

[project.scripts]
hexmb = "hexmb.cli:main"

[tool.setuptools.packages.find]
include = ["hexmb*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
